 
    <div class="container">
       <h2>{{ titulo }}</h2>

<mat-checkbox [(ngModel)]="apenasMeus" (change)="carregar()">
  Apenas meus incidentes
</mat-checkbox>

<table mat-table [dataSource]="lista" class="mat-elevation-z8">

  <ng-container matColumnDef="cod_incidente">
    <th mat-header-cell *matHeaderCellDef>Incidente</th>
    <td mat-cell *matCellDef="let element">
      <a
        href="javascript:void(0)"
        class="link-incidente"
        (click)="abrirDetalhe(element)">
        {{ element.cod_incidente }}
      </a>
    </td>
  </ng-container>

  <ng-container matColumnDef="Solucionador">
    <th mat-header-cell *matHeaderCellDef>Solucionador</th>
    <td mat-cell *matCellDef="let e">{{ e.Solucionador }}</td>
  </ng-container>

  <ng-container matColumnDef="data">
    <th mat-header-cell *matHeaderCellDef>Data</th>
    <td mat-cell *matCellDef="let e">{{ e.data }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>
</div>
