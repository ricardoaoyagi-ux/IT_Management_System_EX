<div class="container">
    <h2>Inc Problem</h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-inc-problem">
      <mat-form-field>
        <input matInput placeholder="Código Problem" formControlName="Cod_Problem" type="number">
      </mat-form-field>

      <mat-form-field>
        <input matInput placeholder="ID Incidente" formControlName="Id_Incidente">
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit">
        {{ editingId ? 'Atualizar' : 'Adicionar' }}
      </button>

      <button *ngIf="editingId" mat-raised-button color="warn" type="button" (click)="cancelarEdicao()">
        Cancelar
      </button>
    </form>

    <table mat-table [dataSource]="lista" class="mat-elevation-z8">
      <ng-container matColumnDef="Id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let element"> {{element.Id}} </td>
      </ng-container>

      <ng-container matColumnDef="Cod_Problem">
        <th mat-header-cell *matHeaderCellDef> Cod Problem </th>
        <td mat-cell *matCellDef="let element"> {{element.Cod_Problem}} </td>
      </ng-container>
      <ng-container matColumnDef="Id_Incidente">
        <th mat-header-cell *matHeaderCellDef> ID Incidente </th>
        <td mat-cell *matCellDef="let element"> {{element.Id_Incidente}} </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Ações </th>
        <td mat-cell *matCellDef="let element">
          <button mat-button color="accent" (click)="editar(element)">Editar</button>
          <button mat-button color="warn" (click)="deletar(element.Id)">Excluir</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
