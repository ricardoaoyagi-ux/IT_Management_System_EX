<div class="container">
    <h2>Senioridade</h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-senioridade">
      <mat-form-field>
        <input matInput placeholder="Categoria" formControlName="Categoria">
      </mat-form-field>

      <mat-form-field>
        <input matInput placeholder="Código" formControlName="Cat">
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit">
        {{ editingId ? 'Atualizar' : 'Adicionar' }}
      </button>

      <button *ngIf="editingId"
              mat-raised-button
              color="warn"
              type="button"
              (click)="cancelarEdicao()">
        Cancelar
      </button>
    </form>

    <table mat-table [dataSource]="lista" class="mat-elevation-z8">

      <ng-container matColumnDef="ID_Senioridade">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let e">{{ e.ID_Senioridade }}</td>
      </ng-container>

      <ng-container matColumnDef="Categoria">
        <th mat-header-cell *matHeaderCellDef>Categoria</th>
        <td mat-cell *matCellDef="let e">{{ e.Categoria }}</td>
      </ng-container>

      <ng-container matColumnDef="Cat">
        <th mat-header-cell *matHeaderCellDef>Código</th>
        <td mat-cell *matCellDef="let e">{{ e.Cat }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let e">
          <button mat-button color="accent" (click)="editar(e)">Editar</button>
          <button mat-button color="warn" (click)="deletar(e.ID_Senioridade!)">Excluir</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
